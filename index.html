
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUEEN MUSIC VIDEO STUDIO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff2de;
      background: linear-gradient(135deg, #160d19, #49213f, #155e63);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .studio {
      width: 100%;
      max-width: 650px;
      padding: 35px;
      border: 1px solid #c9828b;
      border-radius: 22px;
      background: rgba(20, 12, 25, .88);
      box-shadow: 0 15px 50px #0008;
    }
    h1 { color: #e5a1aa; text-align: center; }
    .subtitle { text-align: center; color: #ddd; }
    label { display: block; margin: 22px 0 9px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #c9828b;
      background: #261a2b;
      color: white;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #c9828b;
      color: #211321;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #status { margin-top: 18px; text-align: center; }
    .note { color: #cfc4ce; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="studio">
    <h1>QUEEN MUSIC VIDEO STUDIO</h1>
    <p class="subtitle">Tu música. Tu cantante. Tu videoclip.</p>

    <label for="song">🎵 Sube tu canción (MP3 o WAV)</label>
    <input id="song" type="file" accept="audio/mpeg,audio/wav,audio/*">

    <label for="cover">👑 Sube la imagen de tu cantante</label>
    <input id="cover" type="file" accept="image/*">

    <button id="start">PREPARAR MI VIDEOCLIP</button>

    <p id="status">Esperando tus archivos...</p>
    <p class="note">
      Próximamente: escenas automáticas, conexión con motores de
      vídeo IA y exportación de tu videoclip completo.
    </p>
  </main>

  <script>
    const song = document.getElementById("song");
    const cover = document.getElementById("cover");
    const status = document.getElementById("status");

    document.getElementById("start").addEventListener("click", () => {
      if (!song.files.length || !cover.files.length) {
        status.textContent = "Primero sube tu canción y la imagen de tu cantante.";
        return;
      }
      status.textContent = "¡Archivos cargados! La conexión con los motores de vídeo IA será nuestro siguiente paso.";
    });
  </script>
</body>
</html>
