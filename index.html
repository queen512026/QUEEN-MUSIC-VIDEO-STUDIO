
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUEEN MUSIC VIDEO STUDIO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px;font-family:Arial,sans-serif;color:#fff2de;
 background:linear-gradient(135deg,#160d19,#49213f,#155e63);
}
main{max-width:850px;margin:auto}
.studio{
 background:#1b1220ed;padding:28px;border:1px solid #c9828b;
 border-radius:20px;box-shadow:0 12px 40px #0008;
}
h1{text-align:center;color:#e5a1aa}
.subtitle{text-align:center;color:#ddd}
label{display:block;margin:22px 0 9px;font-weight:bold}
input{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #c9828b;background:#261a2b;color:white
}
button{
 border:0;border-radius:9px;padding:13px 18px;
 background:#c9828b;color:#211321;font-weight:bold;cursor:pointer;
}
button:hover{opacity:.85}
.primary{width:100%;margin-top:22px;font-size:16px}
.preview{
 max-width:220px;max-height:250px;display:none;
 margin:15px auto;border-radius:12px
}
audio{width:100%;margin-top:15px;display:none}
#status{margin-top:20px;text-align:center;color:#e5a1aa}
.scene{
 margin-top:15px;padding:18px;border:1px solid #76506e;
 border-radius:12px;background:#2a1c30;
}
.scene h3{margin-top:0;color:#e5a1aa}
.prompt{white-space:pre-wrap;line-height:1.6;color:#eee}
.small{font-size:13px;color:#cfc4ce;line-height:1.5}
#results{margin-top:25px}
</style>
</head>
<body>
<main>
<section class="studio">
<h1>👑 QUEEN MUSIC VIDEO STUDIO</h1>
<p class="subtitle">Tu música. Tu cantante. Tu videoclip.</p>

<label for="song">🎵 Sube tu canción (MP3 o WAV)</label>
<input id="song" type="file" accept="audio/*">
<audio id="player" controls></audio>

<label for="cover">👑 Imagen de nuestra cantante</label>
<input id="cover" type="file" accept="image/*">
<img id="preview" class="preview" alt="Imagen de la cantante">

<button class="primary" id="analyze">🎬 CREAR PLAN DE ESCENAS</button>
<p id="status">Esperando tus archivos...</p>

<div id="results"></div>

<p class="small">
Esta herramienta divide tu canción en escenas de hasta 8 segundos
y prepara prompts individuales. La generación de vídeo se conectará
en una siguiente etapa.
</p>
</section>
</main>

<script>
const song = document.getElementById("song");
const cover = document.getElementById("cover");
const player = document.getElementById("player");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const results = document.getElementById("results");

let songURL = null;
let imageURL = null;

function formatTime(seconds){
 const m = Math.floor(seconds / 60);
 const s = Math.floor(seconds % 60);
 return `${m}:${String(s).padStart(2,"0")}`;
}

song.addEventListener("change",()=>{
 if(songURL) URL.revokeObjectURL(songURL);
 if(!song.files.length) return;

 songURL = URL.createObjectURL(song.files[0]);
 player.src = songURL;
 player.style.display = "block";
 results.innerHTML = "";
 status.textContent = "Canción cargada. Esperando la imagen de la cantante.";
});

cover.addEventListener("change",()=>{
 if(imageURL) URL.revokeObjectURL(imageURL);
 if(!cover.files.length) return;

 imageURL = URL.createObjectURL(cover.files[0]);
 preview.src = imageURL;
 preview.style.display = "block";
 status.textContent = "Imagen cargada. ¡Ya podemos crear el videoclip!";
});

// Las escenas se definen una sola vez.
const visualScenes = [
{
 title:"La soledad",
 action:"La cantante permanece de pie junto a una ventana mientras observa la lluvia caer. Su expresión refleja tristeza y soledad.",
 camera:"Primer plano lento que se acerca suavemente a su rostro."
},
{
 title:"Pensamientos",
 action:"Sentada junto a la ventana, la cantante baja la mirada y respira profundamente, perdida en sus pensamientos.",
 camera:"Plano medio lateral con un acercamiento lento."
},
{
 title:"Un recuerdo",
 action:"La cantante sostiene una fotografía antigua entre sus manos y la contempla con nostalgia.",
 camera:"Primer plano de la fotografía y transición hacia su rostro."
},
{
 title:"Las lágrimas",
 action:"Una lágrima recorre suavemente su mejilla mientras mira hacia el exterior.",
 camera:"Primerísimo primer plano de sus ojos y rostro."
},
{
 title:"El espejo",
 action:"Frente a un espejo elegante, la cantante observa su reflejo como si estuviera buscando respuestas.",
 camera:"Cámara detrás de su hombro mostrando el reflejo."
},
{
 title:"El pasado",
 action:"La cantante camina lentamente por un pasillo oscuro iluminado por pequeñas luces cálidas.",
 camera:"Travelling hacia atrás mientras ella avanza."
},
{
 title:"La decisión",
 action:"Deja la fotografía sobre una mesa, se endereza y mira hacia adelante con determinación.",
 camera:"Plano detalle de sus manos y luego ascenso hacia su rostro."
},
{
 title:"Dejar atrás",
 action:"La cantante camina alejándose de una habitación oscura sin volver la mirada.",
 camera:"Plano general desde atrás con seguimiento suave."
},
{
 title:"La luz",
 action:"Abre una gran puerta y la luz dorada del amanecer ilumina su rostro.",
 camera:"Contraluz cinematográfico con cámara avanzando lentamente."
},
{
 title:"Un nuevo comienzo",
 action:"Camina por una habitación luminosa con cortinas movidas suavemente por el viento.",
 camera:"Travelling lateral mostrando el movimiento del cabello."
},
{
 title:"Recuperar la voz",
 action:"La cantante se coloca frente a un micrófono antiguo y comienza a interpretar la canción con emoción.",
 camera:"Plano medio con acercamiento lento al micrófono."
},
{
 title:"Fuerza interior",
 action:"Canta con intensidad y sentimiento, transmitiendo una mezcla de dolor y valentía.",
 camera:"Primer plano frontal con movimiento suave de cámara."
},
{
 title:"La transformación",
 action:"La cantante levanta la cabeza y su expresión cambia de tristeza a seguridad.",
 camera:"Cámara asciende lentamente desde el pecho hasta el rostro."
},
{
 title:"Sin miedo",
 action:"Interpreta la canción con los ojos llenos de emoción y una mirada firme.",
 camera:"Primer plano cinematográfico con ligero movimiento circular."
},
{
 title:"La sonrisa",
 action:"La cantante sonríe suavemente mientras continúa cantando, mostrando tranquilidad y confianza.",
 camera:"Acercamiento lento al rostro."
},
{
 title:"La reina del escenario",
 action:"Aparece en un escenario elegante rodeada de luces doradas y canta con fuerza.",
 camera:"Plano general que avanza hacia ella."
},
{
 title:"Libertad",
 action:"Extiende los brazos y disfruta del momento mientras su cabello se mueve con el viento.",
 camera:"Travelling circular alrededor de su cuerpo."
},
{
 title:"El poder de elegir",
 action:"La cantante camina con seguridad por el escenario mientras interpreta la canción.",
 camera:"Seguimiento frontal con movimiento fluido."
},
{
 title:"Renacer",
 action:"Cierra los ojos un instante, respira profundamente y vuelve a cantar con una expresión serena.",
 camera:"Primer plano con acercamiento muy suave."
},
{
 title:"Alegría",
 action:"La cantante realiza movimientos de baile elegantes y naturales, disfrutando de su libertad.",
 camera:"Plano medio con travelling lateral."
},
{
 title:"Un nuevo horizonte",
 action:"Camina por un jardín al amanecer rodeada de luz cálida y flores en movimiento.",
 camera:"Plano general que la sigue desde atrás."
},
{
 title:"Seguridad",
 action:"Se detiene, mira al horizonte y sonríe con una expresión de paz interior.",
 camera:"Plano medio que se transforma lentamente en primer plano."
},
{
 title:"La gran interpretación",
 action:"Canta frente al micrófono con una interpretación poderosa, emotiva y llena de personalidad.",
 camera:"Movimiento lento de acercamiento desde un plano medio."
},
{
 title:"Brillar",
 action:"La cantante aparece bajo luces teatrales doradas, con una presencia elegante y segura.",
 camera:"Cámara gira suavemente alrededor de ella."
},
{
 title:"La mujer que soy",
 action:"Mira directamente hacia la cámara con orgullo y serenidad mientras continúa cantando.",
 camera:"Primer plano frontal estable con pequeño acercamiento."
},
{
 title:"Sin mirar atrás",
 action:"Camina hacia una terraza iluminada por el atardecer, con el cabello moviéndose suavemente.",
 camera:"Travelling posterior que revela el paisaje."
},
{
 title:"Mi propia luz",
 action:"La cantante se gira hacia la cámara y sonríe con seguridad bajo una luz dorada.",
 camera:"Cámara realiza un movimiento semicircular suave."
},
{
 title:"El final",
 action:"Permanece en el escenario, mira directamente a cámara y termina con una sonrisa poderosa y serena.",
 camera:"Primer plano final que se aleja lentamente hasta mostrar el escenario."
}
];

document.getElementById("analyze").addEventListener("click",()=>{
 if(!song.files.length || !cover.files.length){
  status.textContent = "Primero sube tu canción y la imagen de la cantante.";
  return;
 }

 if(!Number.isFinite(player.duration) || player.duration <= 0){
  status.textContent = "Espera a que el reproductor termine de cargar la duración de la canción.";
  return;
 }

 const duration = player.duration;
 const sceneLength = 8;
 const totalScenes = Math.ceil(duration / sceneLength);

 status.textContent = `¡Plan listo! ${totalScenes} escenas preparadas.`;

 results.innerHTML = `
  <h2>🎵 Análisis de tu canción</h2>
  <p>Duración: <strong>${formatTime(duration)}</strong></p>
  <p>Escenas: <strong>${totalScenes}</strong></p>
  <p class="small">Cada escena tiene hasta 8 segundos. Las escenas se suceden siguiendo una historia visual.</p>
  <h2>🎬 Tu historia musical</h2>
 `;

 for(let i=0;i<totalScenes;i++){
  const start = i * sceneLength;
  const end = Math.min(start + sceneLength,duration);
  const scene = visualScenes[i % visualScenes.length];

  const prompt =
`VIDECLIP MUSICAL CINEMATOGRÁFICO — ESCENA ${i+1}

FORMATO: Vertical 9:16.
DURACIÓN: ${Math.ceil(end-start)} segundos.
FRAGMENTO MUSICAL: ${formatTime(start)} a ${formatTime(end)}.

PERSONAJE:
Usar la imagen de referencia como la cantante protagonista.
Conservar exactamente su identidad, rostro, rasgos, cabello largo borgoña oscuro y vestuario de referencia. No rediseñar ni cambiar su apariencia.

ACCIÓN DE ESTA ESCENA:
${scene.action}

MOVIMIENTO DE CÁMARA:
${scene.camera}

ESTILO:
Cinematografía profesional, estética soul blues, iluminación elegante y emocional, tonos cálidos y atmósfera dramática. Movimiento corporal natural y expresivo.

CONTINUIDAD:
Mantener a la misma cantante durante todo el videoclip. Respetar la apariencia de la imagen de referencia y la continuidad de la historia.

EVITAR:
Rostros deformados, manos deformes, dedos adicionales, cambios de identidad, personajes adicionales, textos, subtítulos, logos o diálogos hablados. La cantante interpreta la canción sin añadir voces ni frases ajenas.`;

  const card = document.createElement("div");
  card.className = "scene";

  const heading = document.createElement("h3");
  heading.textContent = `Escena ${i+1}: ${scene.title}`;

  const time = document.createElement("p");
  time.textContent = `⏱️ ${formatTime(start)} – ${formatTime(end)}`;

  const promptText = document.createElement("p");
  promptText.className = "prompt";
  promptText.textContent = prompt;

  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "📋 Copiar prompt";

  button.addEventListener("click",async()=>{
   try{
    await navigator.clipboard.writeText(prompt);
    status.textContent = `¡Escena ${i+1} copiada!`;
   }catch(e){
    const area = document.createElement("textarea");
    area.value = prompt;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    status.textContent = `¡Escena ${i+1} copiada!`;
   }
  });

  card.appendChild(heading);
  card.appendChild(time);
  card.appendChild(promptText);
  card.appendChild(button);
  results.appendChild(card);
 }
});
</script>
</body>
</html>
